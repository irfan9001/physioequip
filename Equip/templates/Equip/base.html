<!DOCTYPE html>
<html lang="en" data-bs-theme="light" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PhysioEquip Catalog{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root {
            /* Logo Colors */
            --brand-primary: #3C3854; /* Deep purple/navy */
            --brand-primary-rgb: 60, 56, 84;
            --brand-secondary: #E6E6EA; /* Silver/grey */
            
            --medical-blue: var(--brand-primary); /* For legacy classes */
            --light-bg: var(--brand-secondary);
            
            /* Bootstrap overrides for Primary Color */
            --bs-primary: var(--brand-primary);
            --bs-primary-rgb: var(--brand-primary-rgb);
            --bs-link-color: var(--brand-primary);
            --bs-link-hover-color: #2A273B;
        }

        /* Bootstrap Button Overrides */
        .btn-primary {
            --bs-btn-bg: var(--brand-primary);
            --bs-btn-border-color: var(--brand-primary);
            --bs-btn-hover-bg: #2A273B;
            --bs-btn-hover-border-color: #2A273B;
            --bs-btn-active-bg: #2A273B;
            --bs-btn-active-border-color: #2A273B;
        }
        .btn-outline-primary {
            --bs-btn-color: var(--brand-primary);
            --bs-btn-border-color: var(--brand-primary);
            --bs-btn-hover-bg: var(--brand-primary);
            --bs-btn-hover-border-color: var(--brand-primary);
        }
        .text-primary { color: var(--brand-primary) !important; }
        .bg-primary { background-color: var(--brand-primary) !important; }
        .border-primary { border-color: var(--brand-primary) !important; }

        html.scroll-smooth {
            scroll-behavior: smooth;
        }
        /* Custom beautiful scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--light-bg); }
        ::-webkit-scrollbar-thumb { background: rgba(var(--brand-primary-rgb), 0.5); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(var(--brand-primary-rgb), 0.8); }

        /* Global body styling & color grading */
        body {
            /* Beautiful subtle gradient background instead of flat color */
            background: radial-gradient(circle at top left, #ffffff, var(--light-bg));
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        main { flex: 1; }
        
        .card {
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            border-radius: 1.2rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(var(--brand-primary-rgb), 0.15);
        }
        .product-img {
            object-fit: cover;
            height: 250px;
            width: 100%;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .card:hover .product-img {
            transform: scale(1.08);
        }
        .overflow-hidden { overflow: hidden; }

        /* Comprehensive Dark Mode Enhancements */
        [data-bs-theme="dark"] body {
            background: radial-gradient(circle at top left, #1a1f24, #121212);
            color: #e9ecef;
        }
        [data-bs-theme="dark"] .card, 
        [data-bs-theme="dark"] .bg-white,
        [data-bs-theme="dark"] .bg-light {
            background-color: rgba(30, 34, 40, 0.8) !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05) !important;
        }
        [data-bs-theme="dark"] .text-dark,
        [data-bs-theme="dark"] .text-body {
            color: #f8f9fa !important;
        }
        [data-bs-theme="dark"] .text-muted {
            color: #adb5bd !important;
        }
        [data-bs-theme="dark"] .border,
        [data-bs-theme="dark"] .border-bottom,
        [data-bs-theme="dark"] .border-top {
            border-color: rgba(255,255,255,0.1) !important;
        }
        [data-bs-theme="dark"] .whatsapp-tooltip {
            background-color: #2b3035 !important;
            color: #fff !important;
        }
        [data-bs-theme="dark"] .whatsapp-tooltip div {
            border-left-color: #2b3035 !important;
        }
        [data-bs-theme="dark"] .bg-body-tertiary {
            background-color: #1a1d20 !important;
        }
    </style>
</head>
<body>

    {% include 'Equip/partials/navbar.html' %}

    <!-- Main Content -->
    <main class="py-5">
        {% if messages %}
        <div class="container mt-3">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm rounded-4 border-0" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    {% include 'Equip/partials/footer.html' %}
    {% include 'Equip/partials/whatsapp_floating.html' %}

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AOS Animation JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    
    <!-- Initialization & Theme Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize AOS
            AOS.init({
                once: true,
                offset: 50,
                duration: 600,
                easing: 'ease-out-cubic',
            });

            // Theme Toggle Logic
            const htmlElement = document.documentElement;
            const themeToggleBtn = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');

            if (themeToggleBtn && themeIcon) {
                // Load saved theme or fallback to light
                const savedTheme = localStorage.getItem('theme') || 'light';
                setTheme(savedTheme);

                themeToggleBtn.addEventListener('click', () => {
                    const currentTheme = htmlElement.getAttribute('data-bs-theme');
                    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                    setTheme(newTheme);
                });

                function setTheme(theme) {
                    htmlElement.setAttribute('data-bs-theme', theme);
                    localStorage.setItem('theme', theme);
                    if (theme === 'dark') {
                        themeIcon.classList.remove('bi-moon-stars-fill');
                        themeIcon.classList.add('bi-sun-fill');
                        themeIcon.classList.add('text-warning');
                    } else {
                        themeIcon.classList.remove('bi-sun-fill', 'text-warning');
                        themeIcon.classList.add('bi-moon-stars-fill');
                    }
                }
            }
        });
    </script>
</body>
</html>
